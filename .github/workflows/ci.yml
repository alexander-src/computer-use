name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux native bindings (numpy, GdkPixbuf, Cairo, TurboJPEG, AT-SPI2, Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-numpy python3-gi python3-cairo gir1.2-gdkpixbuf-2.0 gir1.2-atspi-2.0 libturbojpeg0 xvfb xdotool
      - name: Run unit, TurboJPEG, Cairo, Xvfb background, and stdio protocol tests
        run: /usr/bin/python3 -m unittest discover -s tests -v
      - name: Validate manifests
        run: |
          /usr/bin/python3 -c '
          import json
          p = json.load(open("plugin.json"))
          assert p["name"] == "computer-use"
          assert len(p["suggestedPrompts"]) == 3
          m = json.load(open("mcp_config.json"))
          assert "computer-use" in m["mcpServers"]
          print("Linux manifest validation passed")
          '

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install numpy
        run: python -m pip install --upgrade pip numpy
      - name: Run Windows Win32 unit, GDI/GDI+, Clipboard, UIA COM, Overlay, and stdio protocol tests
        run: python -m unittest discover -s tests -v
      - name: Run non-destructive Windows selftest
        run: python scripts/computer_use_mcp.py --selftest
      - name: Test install.ps1 installer into temporary directory
        shell: pwsh
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP "agcu-plugin-test"
          $env:ANTIGRAVITY_PLUGIN_DIR = $tmp
          ./install.ps1
          python -c "import json, os; d = json.load(open(os.path.join(r'$tmp', 'mcp_config.json'), encoding='utf-8')); srv = d['mcpServers']['computer-use']; assert isinstance(srv['args'], list) and len(srv['args']) == 1 and os.path.isfile(srv['args'][0]); print('install.ps1 verified OK')"

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install numpy
        run: python3 -m pip install --upgrade pip numpy
      - name: Run macOS CoreGraphics, ImageIO, AX, Clipboard, Overlay, and stdio protocol tests
        run: python3 -m unittest discover -s tests -v
      - name: Run non-destructive macOS selftest
        run: python3 scripts/computer_use_mcp.py --selftest
      - name: Test install.sh installer on macOS into temporary directory
        run: |
          TMPDIR_PLUGIN="${RUNNER_TEMP}/agcu-macos-plugin-test"
          ANTIGRAVITY_PLUGIN_DIR="${TMPDIR_PLUGIN}" ./install.sh
          python3 -c 'import json, os, sys; d = json.load(open(os.path.join(sys.argv[1], "mcp_config.json"), encoding="utf-8")); srv = d["mcpServers"]["computer-use"]; assert isinstance(srv["args"], list) and len(srv["args"]) == 1 and os.path.isfile(srv["args"][0]); print("macOS install.sh verified OK")' "${TMPDIR_PLUGIN}"
